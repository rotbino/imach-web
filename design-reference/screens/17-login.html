<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>۱۷ — ورود · لاگین</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .auth-logo { display: grid; place-items: center; padding: 30px 0 6px; }
  .auth-logo img { height: 46px; }
  .auth-title { text-align: center; padding: 4px 30px 0; }
  .auth-title h1 { font-size: 21px; font-weight: 700; }
  .auth-title p { font-size: 12px; color: var(--muted-fg); margin-top: 6px; line-height: 1.9; }

  .login-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 16px 14px 14px;
    margin-top: 18px;
  }

  .phone-input .pre {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 700; color: var(--stone-soft);
    flex-shrink: 0;
  }

  /* OTP */
  .otp-row { display: flex; gap: 8px; direction: ltr; justify-content: center; }
  .otp {
    width: 48px; height: 54px;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    background: #fff;
    display: grid; place-items: center;
    font-size: 21px; font-weight: 700;
    color: var(--foreground);
    position: relative;
  }
  .otp.filled { background: var(--muted); }
  .otp.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  }
  .otp.active::after {
    content: '';
    width: 2px; height: 26px;
    background: var(--primary);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .otp-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px;
    font-size: 11.5px; color: var(--muted-fg);
  }
  .otp-meta .resend b { color: var(--primary-strong); cursor: pointer; }
  .otp-meta .timer {
    display: inline-flex; align-items: center; gap: 5px;
    direction: ltr;
    font-feature-settings: "tnum";
  }
  .otp-meta .timer svg { width: 13px; height: 13px; }

  .ghost-center { text-align: center; margin-top: 14px; }
  .ghost-center button {
    border: 0; background: none; font-family: inherit;
    font-size: 12.5px; font-weight: 700; color: var(--muted-fg);
    cursor: pointer; padding: 6px 10px;
  }

  .swap-link {
    text-align: center; font-size: 12px; color: var(--muted-fg);
    margin-top: 16px; padding-bottom: 4px;
  }
  .swap-link b { color: var(--primary-strong); cursor: pointer; }

  .secure-note {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 22px; font-size: 10.5px; color: var(--muted-fg);
  }
  .secure-note svg { width: 13px; height: 13px; color: var(--green); }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 3v6c0 5-3.5 8.5-7.5 10-4-1.5-7.5-5-7.5-10v-6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
</svg>

<div class="stage">
  <div class="phone" data-arm="sell">

    <!-- ═══ هدر ساده ═══ -->
    <div class="subheader">
      <div class="back"><svg><use href="#i-back"/></svg></div>
      <div class="ttl">ورود<small>یک قدم تا دستیارت</small></div>
      <div style="width:34px"></div>
    </div>

    <!-- ═══ بدنه ═══ -->
    <main class="screen-body">

      <div class="auth-logo"><img src="../assets/logo3.svg" alt="iMach"></div>
      <div class="auth-title">
        <h1>خوش آمدید 👋</h1>
        <p>شماره‌ای که با آن ثبت‌نام کرده‌اید را وارد کنید</p>
      </div>

      <div class="login-card">

        <div class="field">
          <label>شماره موبایل</label>
          <div class="input phone-input">
            <span class="pre">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
              ۹۸+
            </span>
            <span style="direction:ltr;font-feature-settings:'tnum'">۰۹۱۲ ۳۴۵ ۶۷۸۹</span>
          </div>
        </div>

        <div class="field">
          <label>کد تایید ۵ رقمی</label>
          <div class="hint" style="margin-top:0;margin-bottom:9px">
            پیامک‌شده به همین شماره — <span style="direction:ltr;display:inline-block">۰۹۱۲***۶۷۸۹</span>
          </div>
          <div class="otp-row">
            <div class="otp filled">۴</div>
            <div class="otp filled">۷</div>
            <div class="otp filled">۲</div>
            <div class="otp filled">۹</div>
            <div class="otp active"></div>
          </div>
          <div class="otp-meta">
            <span class="timer"><svg><use href="#i-clock"/></svg> ۰۱:۱۲</span>
            <span class="resend">ارسال مجدد کد تا <b>۱ دقیقه</b> دیگر</span>
          </div>
        </div>

      </div>

      <div class="ghost-center">
        <button>ورود با رمز عبور</button>
      </div>

      <div class="swap-link">حساب ندارید؟ <b>ساخت حساب</b></div>

      <div class="secure-note"><svg><use href="#i-shield"/></svg> ورود شما با کد یک‌بار‌مصرف امن است</div>

    </main>

    <!-- ═══ اکشن چسبان ═══ -->
    <div class="action-bar">
      <button class="btn btn-primary btn-block" style="height:48px;font-size:15px">ورود به ای‌مچ</button>
    </div>

  </div>
</div>
</body>
</html>
