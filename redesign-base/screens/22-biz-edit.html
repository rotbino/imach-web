<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>۲۲ — ویرایش کسب‌وکار · دستیار فروش</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
</svg>

<div class="stage">
  <div class="phone" data-arm="sell">

    <header class="subheader">
      <button class="back"><svg><use href="#i-back"/></svg></button>
      <div class="ttl">ویرایش کسب‌وکار<small>پخش برنج پارس · رشت</small></div>
    </header>

    <main class="screen-body">

      <!-- هویت کسب‌وکار -->
      <div class="card" style="display:flex;align-items:center;gap:12px">
        <div class="avatar-lg" style="background:linear-gradient(135deg,#c2703a,#ea580c)">پ</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:700">عکس کسب‌وکار</div>
          <div style="font-size:11px;color:var(--muted-fg);margin-top:2px;line-height:1.8">لوگو یا عکس فروشگاه — در کاتالوگ عمومی دیده می‌شود</div>
        </div>
        <button class="btn btn-sm btn-outline">تعویض عکس</button>
      </div>

      <!-- فرم ویرایش -->
      <div class="field" style="margin-top:12px">
        <label>نام کسب‌وکار</label>
        <input class="input" value="پخش برنج پارس">
      </div>

      <div class="field">
        <label>صنف</label>
        <input class="input" value="پخش مواد غذایی">
        <div class="hint">صنف از میان اصناف ای‌مچ انتخاب می‌شود</div>
      </div>

      <div class="field">
        <label>شهر</label>
        <div class="pillchoice">
          <button class="pill active">رشت</button>
          <button class="pill">تهران</button>
          <button class="pill">قزوین</button>
        </div>
      </div>

      <div class="field">
        <label>معرفی کوتاه</label>
        <textarea class="input">فروش عمده برنج هاشمی و طارم — مستقیم از شالی‌زار گیلان</textarea>
        <div class="hint" style="text-align:left">۴۲ / ۱۶۰</div>
      </div>

    </main>

    <div class="action-bar">
      <button class="btn btn-primary" style="flex:1">ذخیره تغییرات</button>
    </div>

  </div>
</div>
</body>
</html>
