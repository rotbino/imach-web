<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>۱۹ — گفتگو</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  /* ═══ گفتگو — حباب‌ها و نوار تایپ، هم‌زبان بیس ═══ */
  .chat-day {
    width: max-content; margin: 4px auto 12px;
    background: var(--muted); color: var(--muted-fg);
    font-size: 10px; font-weight: 700;
    border-radius: 999px; padding: 4px 12px;
  }
  .msg { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 10px; }
  .msg.out { align-items: flex-end; }
  .msg .bub {
    max-width: 268px;
    background: #fff; border: 1px solid var(--border);
    border-radius: 16px 16px 16px 5px;
    padding: 9px 12px;
    font-size: 13px; line-height: 1.9; color: var(--stone-soft);
    box-shadow: var(--shadow-card);
  }
  .msg.out .bub {
    background: var(--arm); border-color: transparent; color: #fff;
    border-radius: 16px 16px 5px 16px;
  }
  .msg .tm { font-size: 9px; color: var(--muted-fg); margin-top: 4px; }
  .msg .bub .ph-thumb {
    display: grid; place-items: center;
    width: 132px; height: 96px;
    border-radius: 10px;
    background: linear-gradient(135deg, #fdeedd, #f97316);
    color: #fff; font-size: 11px; font-weight: 700;
    margin-bottom: 6px;
  }
  .msg .bub .ph-cap { font-size: 11px; opacity: .85; display: block; }

  /* نوار پایین گفتگو */
  .chat-foot {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, .97);
    backdrop-filter: blur(8px);
    padding: 9px 12px 13px;
    z-index: 5;
  }
  .quick-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 9px; }
  .quick-chips::-webkit-scrollbar { display: none; }
  .quick-chips .chip { padding: 6px 12px; font-size: 11.5px; }
  .composer { display: flex; gap: 8px; align-items: center; }
  .c-ico {
    width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--border-strong); background: #fff;
    color: var(--muted-fg); display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
  }
  .c-ico svg { width: 18px; height: 18px; }
  .c-send {
    width: 44px; height: 44px; border-radius: 12px;
    border: 0; background: var(--arm); color: #fff;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .c-send svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 2 .7 2.9a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.5c.9.3 1.9.6 2.9.7a2 2 0 011.7 2z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 15.5l-4.5-4.5-7.5 7.5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10.5 13.5"/><path d="M21 3l-7 18-3.5-7.5L3 10z"/></symbol>
</svg>

<div class="stage">
  <div class="phone" data-arm="keep">

    <!-- ═══ هدر گفتگو: بازگشت + مخاطب + تماس ═══ -->
    <header class="subheader">
      <button class="back"><svg><use href="#i-back"/></svg></button>
      <div class="avatar-sm" style="background:linear-gradient(135deg,#c2703a,#ea580c)">پ</div>
      <div class="ttl">پخش برنج پارس<small>معمولاً سریع جواب می‌دهد · رشت</small></div>
      <button class="icon-btn" aria-label="تماس با پخش برنج پارس"><svg><use href="#i-phone"/></svg></button>
    </header>

    <!-- ═══ بدنهٔ گفتگو ═══ -->
    <main class="screen-body">

      <div class="chat-day">امروز</div>

      <div class="msg in">
        <div class="bub">سلام — قیمت امروز برنج درجه یک چنده؟ برای ۵۰ کیسه</div>
        <span class="tm">۱۰:۱۲</span>
      </div>

      <div class="msg out">
        <div class="bub">سلام. ۸۹٬۵۰۰ کیلو — کیسهٔ ۱۰ کیلویی ۸۹۵٬۰۰۰. موجودی دارم، ارسال امروز</div>
        <span class="tm">۱۰:۱۴</span>
      </div>

      <div class="msg in">
        <div class="bub">
          <span class="ph-thumb">۱۰ کیلو</span>
          <span class="ph-cap">عکس کالای امروز — بستهٔ ۱۰ کیلویی</span>
        </div>
        <span class="tm">۱۰:۱۵</span>
      </div>

      <div class="msg out">
        <div class="bub">عالی — ۵۰ کیسه رزرو کنید، فردا صبح می‌آیم</div>
        <span class="tm">۱۰:۱۶</span>
      </div>

    </main>

    <!-- ═══ نوار تایپ + پاسخ‌های سریع ═══ -->
    <div class="chat-foot">
      <div class="quick-chips">
        <button class="chip">قیمت امروز؟</button>
        <button class="chip">موجودی دارید؟</button>
        <button class="chip">شرایط پرداخت؟</button>
        <button class="chip">تحویل چه روزی؟</button>
      </div>
      <div class="composer">
        <button class="c-ico" aria-label="ارسال عکس"><svg><use href="#i-image"/></svg></button>
        <div class="input" style="flex:1"><span class="ph">پیام…</span></div>
        <button class="c-send" aria-label="ارسال پیام"><svg><use href="#i-send"/></svg></button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
