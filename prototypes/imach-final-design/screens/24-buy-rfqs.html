<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۲۴: استعلام‌های من (خریدار) — FD-14 رندر پویا
     ▸ دو بخش: باز (rfqsOut status=current) / پایان‌یافته (done).
     ▸ عنوان‌ها با پیشوند «درخواست قیمت …» (حکم مالک FD-14).
     ▸ لمس استعلام باز → مقایسهٔ پیشنهادهای «همان» استعلام (۲۶ با
       پارامتر rfq) — قبلاً ردیف رب هم به پیشنهادهای برنج می‌رفت
       (نقطه‌شکسته).
     ▸ حلقهٔ کامل (حکم مالک FD-14): «خریدار استعلامش را تمام کند —
       استعلام باز را ببندد و تمام» ⇒ پذیرش پیشنهاد (۲۷) یا «بستن
       استعلام» (۲۶) ردیف را به «پایان‌یافته» می‌برد.
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-buy-rfqs" data-arm="buy">

        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">استعلام‌های من<small id="buy-rfqs-sub">۲ باز · ۱ پایان‌یافته</small></div>
    </div>

    <div class="body">
        <button class="btn btn-block btn-arm" data-go="s-buy-rfq-new">
            <svg><use href="#i-plus"/></svg> استعلام جدید
        </button>

        <div class="section-title"><h2>باز</h2></div>
        <div class="rows" id="buy-rfqs-open"></div>

        <div class="section-title" style="margin-top: 8px;"><h2>پایان‌یافته</h2></div>
        <div class="rows" id="buy-rfqs-done"></div>
    </div>
</section>
