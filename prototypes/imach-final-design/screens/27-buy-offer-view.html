<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۲۷: جزئیات پیشنهاد — FD-14 رندر پویا (offerViewRender)
     ▸ کارت فروشنده + قیمت با معادل واحد + مشخصات استعلام +
       شرایط (پرداخت/تحویل — همان ساختار فرم ۱۲: «۶۰٪ نقدی + ۴۰٪
       چک (تا ۶۰ روز)» / «ارسال — حمل با فروشنده») + راه‌های ارتباط.
     ▸ «پذیرش پیشنهاد» = پایان استعلام (حکم مالک FD-14): پس از
       پذیرش، استعلام بسته می‌شود، بقیهٔ تأمین‌کننده‌ها خبردار
       می‌شوند و ردیف به «پایان‌یافته» می‌رود (rfq.status=done).
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-buy-offer-view" data-arm="buy">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">جزئیات پیشنهاد<small id="ovf-seller">شالی‌زار طالب</small></div>
    </div>

    <div class="body">
        <!-- کارت فروشنده -->
        <div class="card" style="display: flex; gap: 12px; align-items: center;" id="ovf-head"></div>

        <!-- قیمت -->
        <div class="offer-summary">
            <div style="font-size: 11.5px; color: var(--text-3); margin-bottom: 4px;" id="ovf-price-lbl">قیمت هر کیسهٔ ۵۰ کیلویی</div>
            <div class="big-price" id="ovf-price">۲٬۷۸۰٬۰۰۰ <small>تومان</small></div>
            <div class="unit-price" id="ovf-unit" hidden>
                <svg><use href="#i-info"/></svg>
                <span id="ovf-unit-tx"></span>
            </div>
        </div>

        <!-- مشخصات استعلام + شرایط -->
        <div class="card" style="padding: 4px 14px;" id="ovf-facts"></div>

        <!-- یادداشت فروشنده -->
        <div class="callout callout-info" id="ovf-note" hidden>
            <svg><use href="#i-msg"/></svg>
            <div>
                <b>یادداشت فروشنده:</b>
                <div style="margin-top: 4px;" id="ovf-note-tx"></div>
            </div>
        </div>

        <div class="section-title"><h2>راه‌های ارتباط</h2></div>

        <div class="rows">
            <div class="row" data-go="s-chat">
                <div class="thumb thumb-sm" style="background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-msg"/></svg>
                </div>
                <div class="row-body">
                    <div class="row-title">پیام در آی‌مچ</div>
                    <div class="row-sub">سریع‌ترین راه — پاسخ فروشنده در همان گفتگو</div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
            <div class="row" data-dial>
                <div class="thumb thumb-sm" style="background: var(--green-soft); color: var(--green); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-phone"/></svg>
                </div>
                <div class="row-body">
                    <div class="row-title">تماس تلفنی</div>
                    <div class="row-sub" dir="ltr" style="justify-content: flex-end;">۰۹۱۱ ۲۳۴ ۵۶۷۸</div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
            <div class="row" data-go="s-buy-supplier-view">
                <div class="thumb thumb-sm" style="background: var(--surface-2); color: var(--text-2); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-store"/></svg>
                </div>
                <div class="row-body">
                    <div class="row-title">کاتالوگ فروشنده</div>
                    <div class="row-sub">محصولات دیگر را ببین</div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
        </div>
    </div>

    <div class="sticky-bar">
        <button class="btn btn-outline" style="flex: .7;" data-go="s-chat">
            <svg><use href="#i-msg"/></svg> پیام
        </button>
        <button class="btn btn-primary" style="flex: 1.3;" data-accept-offer id="ovf-accept">
            <svg><use href="#i-check"/></svg> پذیرش پیشنهاد
        </button>
    </div>
</section>
