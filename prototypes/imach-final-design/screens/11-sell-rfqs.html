<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۱۱: درخواست‌های قیمت (فروشنده) — FD-14 رندر پویا
     دو بخش: در انتظار پاسخ (rfqsIn) + پاسخ داده‌شده (rfqsAnswered).
     ▸ عنوان هر ردیف با پیشوند «درخواست قیمت …» (حکم مالک FD-14):
       «به جای برنج هاشمی → درخواست قیمت برنج هاشمی» — لیست گویاتر.
     ▸ هر ردیف پارامتر rfq را به فرم پیشنهاد (۱۲) می‌برد —
       «درخواست ۳ قلمی» هم فرم خودش را می‌گیرد (نقطه‌شکستهٔ قبلی).
     ▸ فیلتر یک‌بارمصرفِ مشتری (از دفتر مشتری) همچنان روی همین
       ردیف‌ها کار می‌کند (rfqsFilterApply در app-customers.js).
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-sell-rfqs" data-arm="sell">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">درخواست‌های قیمت<small id="sell-rfqs-sub">۲ مورد در انتظار پاسخ</small></div>
    </div>

    <div class="body">
        <div class="callout callout-warn">
            <svg><use href="#i-clock"/></svg>
            <div>هر درخواست یک <b>مهلت</b> دارد. تا قبل از پایان مهلت قیمتت را بفرست؛ بعد از آن، درخواست بسته می‌شود.</div>
        </div>

        <div class="rows" id="sell-rfqs-rows"></div>

        <div class="section-title" style="margin-top: 8px;"><h2>پاسخ داده‌شده</h2></div>
        <div class="rows" id="sell-rfqs-done"></div>

        <!-- حالت خالی — وقتی دفتر برحسب یک مشتری فیلتر شده باشد -->
        <div id="sell-rfqs-empty" hidden>
            <div class="empty">
                <div class="empty-ic"><svg><use href="#i-inbox"/></svg></div>
                <h3>درخواستی از این مشتری پیدا نشد</h3>
                <p>وقتی این مشتری از تو استعلام قیمت بگیرد، همین‌جا می‌آید.</p>
            </div>
        </div>
    </div>
</section>
