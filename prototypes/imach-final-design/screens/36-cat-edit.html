<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۳۶: ویرایش کاتالوگ
     نام، لوگو، شهر، لوکیشن و توضیح کوتاه
     ═════════════════════════════════════════════════════════════ -->

<section class="screen" id="s-cat-edit" data-arm="sell">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">ویرایش کاتالوگ<small>اطلاعاتی که خریداران می‌بینند</small></div>
    </div>

    <div class="body">

        <!-- لوگو -->
        <div class="card" style="display: flex; align-items: center; gap: 12px;">
            <div class="avatar avatar-lg" style="background: linear-gradient(135deg,#c2703a,#ea580c)">پ</div>
            <div style="flex: 1; min-width: 0;">
                <div style="font-size: 13.5px; font-weight: 700;">لوگوی کاتالوگ</div>
                <div style="font-size: 11px; color: var(--text-3); margin-top: 2px; line-height: 1.8;">کنار نامت در کاتالوگ عمومی و پیام‌ها دیده می‌شود</div>
            </div>
            <button class="btn btn-sm btn-outline" type="button">تعویض</button>
        </div>

        <!-- نام کاتالوگ -->
        <div class="field" style="margin-top: 12px;">
            <label>نام کاتالوگ</label>
            <input class="input" value="پخش برنج پارس">
            <div class="hint">این نام روی کاتالوگ و پیام‌های شما دیده می‌شود</div>
        </div>

        <!-- توضیح کوتاه -->
        <div class="field">
            <label>توضیح کوتاه <span class="opt">— اختیاری</span></label>
            <textarea class="input" placeholder="مثلاً: فروش عمده برنج هاشمی و طارم — مستقیم از شالی‌زار گیلان"></textarea>
        </div>

        <!-- شهر -->
        <div class="field">
            <label>شهر</label>
            <button class="input sel" type="button">
                <span style="color: var(--foreground); font-weight: 700;">رشت</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--text-3);flex-shrink:0"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
        </div>

        <!-- لوکیشن روی نقشه -->
        <div class="field">
            <label>لوکیشن روی نقشه</label>
            <div class="loc-box">
                <div class="loc-map">
                    <img src="png/map-flat.jpg" alt="نقشهٔ لوکیشن">
                    <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.1-7-11a7 7 0 1114 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
                </div>
                <div class="loc-row">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.1-7-11a7 7 0 1114 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
                    <span>رشت — جادهٔ فومن، انبار مرکزی</span>
                    <button class="btn btn-sm btn-outline" type="button">انتخاب از نقشه</button>
                </div>
            </div>
        </div>

        <!-- آدرس -->
        <div class="field">
            <label>آدرس <span class="opt">— اختیاری</span></label>
            <input class="input" value="رشت، خیابان معلم، جنب پمپ بنزین، انبار برنج پارس">
            <div class="hint">برای مراجعهٔ خریداران محلی — نمایش آن اختیاری است</div>
        </div>

        <!-- نوع کسب‌وکار -->
        <div class="field">
            <label>نوع کسب‌وکار</label>
            <button class="input sel" type="button">
                <span style="color: var(--foreground); font-weight: 700;">عمده‌فروش</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--text-3);flex-shrink:0"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="hint">خریدار از همان اول می‌داند از تولیدکننده می‌خرد یا از عمده‌فروش</div>
        </div>

    </div>

    <div class="sticky-bar">
        <button class="btn btn-primary btn-block" data-edit-save>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-check"/></svg>
            ذخیره تغییرات
        </button>
    </div>
</section>
