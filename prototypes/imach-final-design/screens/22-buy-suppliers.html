<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۲۲: تأمین‌کنندگان من — دفتر تأمین‌کننده
     ─────────────────────────────────────────────────────────────
     FD-16 (حکم مالک): غنی‌سازی به قرینهٔ دفتر مشتریان (۰۸):
     • جستجو + دکمهٔ «دعوت تأمین‌کننده جدید» (= شیت اشتراک لیست خرید).
     • رندر دیتامحور از DATA.suppliers (suppliersRender در
       app-suppliers.js) — تأمین‌کننده‌های پیشنهادی (isNew) اولِ
       لیست با دکمه‌های «تایید / حذف» (پیشنهاد تامین رسیده).
     • لمس هر ردیف → صفحهٔ جزئیات تأمین‌کننده (s-supplier-view).
     • منوی سه‌نقطه = شیت از پایین (گفتگو · کاتالوگ او · حذف).
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-buy-suppliers" data-arm="buy">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">تأمین‌کنندگان من<small id="sup-count">۵ تأمین‌کننده</small></div>
        <button class="icon-btn" id="sup-invite" aria-label="دعوت تأمین‌کننده جدید"><svg><use href="#i-user-plus"/></svg></button>
    </div>

    <div class="body">
        <!-- جستجو -->
        <div class="search-row" style="height: 44px;">
            <svg><use href="#i-search"/></svg>
            <input type="text" id="sup-search" placeholder="جستجوی تأمین‌کننده، کسب‌وکار، شهر…" autocomplete="off">
        </div>

        <!-- دعوت تأمین‌کننده جدید — از طریق اشتراک لیست خرید
             (حکم مالک FD-16: دعوت = شیت اشتراک، نه کپیِ فقط لینک) -->
        <button class="btn btn-arm btn-block" id="sup-invite-2" type="button" style="margin-top: 10px;">
            <svg><use href="#i-user-plus"/></svg> دعوت تأمین‌کننده جدید
        </button>

        <!-- لیست تأمین‌کننده‌ها — دیتامحور (app-suppliers.js) -->
        <div class="rows" id="sup-list" style="margin-top: 12px;"></div>

        <!-- تنها جملهٔ توضیح این صفحه -->
        <div class="hint-line">
            <svg><use href="#i-sparkles"/></svg>
            <span>هر کاتالوگی که ذخیره کنی یک تأمین‌کننده می‌شود؛ هر کس به لیست خریدت پیشنهاد تامین بدهد و تایید کنی هم همین‌طور.</span>
        </div>
    </div>

    <!-- ═══ شیت: گزینه‌های تأمین‌کننده ═══
         قانون همیشگی موبایل: همهٔ منوها/مدال‌ها از پایین باز می‌شوند، معلق ممنوع.
         محتوای ردیف‌ها با supMenuOpen() در app-handlers.js پر می‌شود. -->
    <div class="sheet" id="sheet-sup-menu" hidden>
        <div class="grab"></div>
        <div class="sheet-hdr">
            <h3 id="scm-ttl">گزینه‌های تأمین‌کننده</h3>
            <button class="mg" data-sheet-close="sheet-sup-menu" aria-label="بستن"><svg><use href="#i-x"/></svg></button>
        </div>
        <div id="scm-list"></div>
        <button class="btn btn-outline btn-block" data-sheet-close="sheet-sup-menu" style="margin-top: 8px;">بستن</button>
    </div>
</section>
