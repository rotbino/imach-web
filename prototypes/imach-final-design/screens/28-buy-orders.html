<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۲۸: سفارش‌های من (خریدار)
     FD-18 — رندر پویا از DATA.ordersOut (ordersBuyRender):
     • «جاری» (new/accepted/sent) + «بایگانی» (delivered/rejected/
       cancelled) — شمارندهٔ زیرعنوان زنده.
     • هر ردیف data-ord-go → نمای خریدارِ همان سفارش (۳۹ — جدید).
       قبلاً ردیف‌ها «فقط نمایشی» بودند و لمسشان کاری نمی‌کرد.
     • سفارش‌هایی که از سبد کاتالوگ ثبت می‌شوند همین‌جا می‌آیند.
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-buy-orders" data-arm="buy">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">سفارش‌های من<small id="buy-orders-sub">۱ سفارش جاری</small></div>
    </div>

    <div class="body">
        <div id="buy-orders-host"></div>

        <div class="hint-line">
            <svg><use href="#i-info"/></svg>
            <span>وضعیت هر سفارش همین‌جا به‌روز می‌شود؛ پرداخت و تحویل مستقیماً با تأمین‌کننده هماهنگ می‌شود.</span>
        </div>
    </div>

    <!-- ═══ شیت: گزینه‌های سفارش خرید ═══
         قانون همیشگی موبایل: همهٔ منوها/مدال‌ها از پایین باز می‌شوند، معلق ممنوع.
         محتوای ردیف‌ها با ordMenuOpen() در app-handlers.js پر می‌شود. -->
    <div class="sheet" id="sheet-ord-menu" hidden>
        <div class="grab"></div>
        <div class="sheet-hdr">
            <h3 id="ocm-ttl">گزینه‌های سفارش</h3>
            <button class="mg" data-sheet-close="sheet-ord-menu" aria-label="بستن"><svg><use href="#i-x"/></svg></button>
        </div>
        <div id="ocm-list"></div>
        <button class="btn btn-outline btn-block" data-sheet-close="sheet-ord-menu" style="margin-top: 8px;">بستن</button>
    </div>
</section>
