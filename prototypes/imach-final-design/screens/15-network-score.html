<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۱۵: امتیاز فعالیت
     ─────────────────────────────────────────────────────────────
     روایت: شبکه‌ات را بساز → به ۱۰۰ برس → ما شتابت می‌دهیم.
     محتوا با scoreRender پر می‌شود.
     ═════════════════════════════════════════════════════════════ -->

<section class="screen" id="s-network-score" data-arm="keep">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl" id="sc-ttl">امتیاز فعالیت<small id="sc-sub">شبکه‌ات را بساز</small></div>
    </div>

    <div class="body">

        <!-- ═══ Hero: امتیاز + روایت ═══ -->
        <div class="score-hero" style="flex-direction: column; text-align: center;">
            <div class="score-circle" style="width: 104px; height: 104px; border-width: 6px;">
                <div class="num" style="font-size: 32px;"><span id="sc-num">۰</span><small>از ۱۰۰</small></div>
            </div>
            <div>
                <div style="font-size: 15px; font-weight: 700; margin-bottom: 6px;" id="sc-hero-t">امتیاز فعالیت</div>
                <p style="font-size: 11.5px; color: var(--text-3); line-height: 1.95;" id="sc-hero-p"></p>
                <div class="progress-track" style="margin-top: 14px; max-width: 260px; margin-left: auto; margin-right: auto;">
                    <i id="sc-bar" style="width: 0%;"></i>
                </div>
            </div>
        </div>

        <!-- ═══ کارهای انجام‌شده ═══ -->
        <div id="sc-done-wrap">
            <div class="section-title"><h2>کارهایی که انجام داده‌ای</h2></div>
            <div class="rows" id="sc-done"></div>
        </div>

        <!-- ═══ کارهای مانده ═══ -->
        <div id="sc-todo-wrap">
            <div class="section-title" style="margin-top: 8px;"><h2>کارهایی که مانده</h2></div>
            <div class="rows" id="sc-todo"></div>
        </div>

    </div>
</section>
