<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۲۹: پیام‌ها
     فهرست گفتگوها — لمس هر ردیف → گفتگو.
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-msgs" data-arm="keep">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">پیام‌ها<small>۳ گفتگو</small></div>
    </div>

    <div class="body">
        <div class="rows">
            <div class="row" data-go="s-chat">
                <div class="avatar" style="background: linear-gradient(135deg,#c2703a,#ea580c)">پ</div>
                <div class="row-body">
                    <div class="row-title">پخش برنج پارس</div>
                    <div class="row-sub">عالی — ۵۰ کیسه رزرو کنید</div>
                </div>
                <div style="text-align: left; flex-shrink: 0;">
                    <div style="font-size: 10px; color: var(--text-3);">۱۰:۱۶</div>
                    <div style="min-width: 18px; height: 18px; padding: 0 5px; background: var(--primary); color: #FFF; border-radius: 9px; font-size: 10px; font-weight: 700; display: grid; place-items: center; margin-top: 4px; margin-right: auto;">۱</div>
                </div>
            </div>

            <div class="row" data-go="s-chat">
                <div class="avatar" style="background: #0e7490;">ک</div>
                <div class="row-body">
                    <div class="row-title">کیان غلات</div>
                    <div class="row-sub">قیمت امروز را فرستادم</div>
                </div>
                <div style="font-size: 10px; color: var(--text-3); flex-shrink: 0;">۹:۴۲</div>
            </div>

            <div class="row" data-go="s-chat">
                <div class="avatar" style="background: #7c3aed;">م</div>
                <div class="row-body">
                    <div class="row-title">رستوران مهر</div>
                    <div class="row-sub">فردا ۱۰ صبح تحویل می‌دهم</div>
                </div>
                <div style="font-size: 10px; color: var(--text-3); flex-shrink: 0;">دیروز</div>
            </div>
        </div>
    </div>
</section>
