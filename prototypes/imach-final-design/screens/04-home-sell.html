<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۰۴: میز فروش — کارتابل فروش
     ─────────────────────────────────────────────────────────────
     فلسفه (حکم مالک، FD-4): میز فروش = «کارتابل فروش».
     بالای صفحه فقط چند لینک مهم؛ بقیهٔ صفحه = اعلام کارهای نیازمند اقدام.

     بازبینی مالک (FD-6):
     • دایرهٔ امتیاز از صفحه برداشته شد و به اپ‌بار برگشت (score-chip)
       — کلیک روی دایره → صفحهٔ «امتیاز فعالیت». (تصمیم FD-5 لغو شد.)
     • روی صفحه فقط دو کادر تمام‌عرض زیر هم:
       کاتالوگ من + مشتریان من (کادر «امتیاز فعالیت» حذف شد).
     • زیر اقدام‌ها، کارت «گام بعدی فعالیت»:
       «۵۵ امتیاز تا شتابدهی» + موشک روبه‌رو · جملهٔ گام ·
       نوار پیشرفت «۴۵/۱۰۰» + موشک در انتها · دکمهٔ اقدام.
       (دکمه به حکم FD-6 برگشت — «افزودن محصول»؛ اعداد از دیتا محاسبه می‌شوند.)
     • واژگان (قانون FD-5): چیزی که در کاتالوگ می‌فروشی «محصول» است نه
       «کالا». گروه کالا > کالا > محصول — مثال مالک: برنج / برنج هاشمی /
       برنج هاشمی برند طبیعت ۱۰ کیلویی. لیست خرید خریدار «کالا» دارد.

    بازبینی مالک (FD-8):
     • «کاتالوگ من» و «مشتریان من» از ردیف‌های «نیازمند اقدام» متمایز شدند:
       دو کاشی نیمه‌عرض کنار هم با عدد بزرگ (وضعیتِ ویترین/شبکه) —
       بالا می‌گویند «چه داری»، پایین می‌گویند «چه کاری مانده».
     • شتابدهی در دو میز دو معنای جدا دارد (حکم مالک FD-8):
       فروش = محصولاتِ تو به خریداران بیشتر نشان داده می‌شود؛
       خرید = تأمین‌کننده‌های بیشتری از هر کالا به تو نشان داده می‌شود.

     بازبینی مالک (FD-12):
     • کارت قهرمانِ «گام بعدی فعالیت» حذف شد — گام‌های شروع هم در واقع
       «اقدام»‌اند، فقط موقتی (راه‌اندازی/تشویق) نه همیشگی و روزانه.
       جای آن، ردیفی ساده در همان فهرست «نیازمند اقدام» می‌نشیند با
       نشان کوچک «شروع» (row-start) — کم‌ادعا و هم‌قد با بقیهٔ ردیف‌ها.
       امتیاز همچنان فقط در چیپ اپ‌بار و صفحهٔ امتیاز می‌ماند.
     • تب‌های پایین: «میز فروش» و «میز خرید» به‌جای «فروش»/«خرید» —
       لینک پایین به «جا» می‌رود و نام جا با ناوبری پنل یکدست می‌شود.

    بازبینی مالک (FD-16):
     • چهار کاشی جمع‌وجور (حکم: «همهٔ لینکها اون بالا») — کاتالوگ /
       مشتریان / سفارشات رسیده / درخواست‌های قیمت؛ زیرمتن‌های تزیینی
       («در ویترین تو» و…) حذف شد؛ «N در انتظار تایید» ماند (حکم مالک).
     • «در انتظار تایید» حتماً در کارتابل اقدام هم هست: مشتری جدید
       (customers isNew) → دفتر مشتریان (۰۸).

    داده و منطق: deskHomeSync() در app-forms.js + scoreItemsSell در data.js
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-home-sell" data-arm="sell">
    <div class="appbar">
        <div class="brand">
            <!-- FD-15 (حکم مالک): هدر هر میز نام کسب‌وکار را می‌گوید —
                 «میز فروش سوپرمارکت آریا» / «میز خرید سوپرمارکت آریا».
                 شخصیت دموی هر دو میز یک کسب‌وکار است (b1 در data.js). -->
            <div class="brand-logo">آ</div>
            <div class="title">میز فروش سوپرمارکت آریا</div>
        </div>
        <div class="actions">
            <!-- FD-6: دایرهٔ امتیاز در اپ‌بار — تنها جای امتیاز در این صفحه.
                 کلیک → صفحهٔ امتیازها (data-score-arm در app-handlers.js).
                 حلقه و عدد با deskHomeSync() سینک می‌شوند. -->
            <button class="score-chip" id="desk-chip" data-score-arm="sell" aria-label="امتیاز فعالیت — دیدن جزئیات" type="button">
                <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
                    <circle class="rc-bg" cx="22" cy="22" r="18"></circle>
                    <circle class="rc-fill" id="desk-chip-ring" cx="22" cy="22" r="18"></circle>
                </svg>
                <b id="desk-chip-num">۰</b>
            </button>
            <button class="icon-btn" data-go="s-notifs" aria-label="اعلان‌ها">
                <svg><use href="#i-bell"/></svg>
                <span class="dot">۳</span>
            </button>
        </div>
    </div>

    <div class="body">

        <!-- FD-16 (حکم مالک): چهار کاشی جمع‌وجور — «همهٔ لینکها بالا»:
             کاتالوگ / مشتریان / سفارشات رسیده / درخواست‌های قیمت.
             زیرمتن تزیینی حذف؛ فقط دادهٔ واقعی (N در انتظار تایید) ماند.
             عدد محصولات از listings (deskHomeSync)؛ مشتری از customers؛
             سفارش از ordersIn؛ درخواست از rfqsIn. -->
        <div class="desk-duo">
            <button class="desk-tile" data-go="s-catalog" type="button">
                <span class="dt-head">
                    <span class="dt-ic"><svg><use href="#i-store"/></svg></span>
                    <b class="dt-t">کاتالوگ من</b>
                    <svg class="dt-chev" aria-hidden="true"><use href="#i-chev"/></svg>
                </span>
                <div class="dt-stat"><b id="desk-cat-num">۰</b><span>محصول</span></div>
            </button>
            <button class="desk-tile" data-go="s-customers" type="button">
                <span class="dt-head">
                    <span class="dt-ic"><svg><use href="#i-users"/></svg></span>
                    <b class="dt-t">مشتریان من</b>
                    <svg class="dt-chev" aria-hidden="true"><use href="#i-chev"/></svg>
                </span>
                <div class="dt-stat"><b id="desk-cust-num">۰</b><span>مشتری</span></div>
                <div class="dt-sub" id="desk-cust-sub"></div>
            </button>
            <button class="desk-tile" data-go="s-sell-orders" type="button">
                <span class="dt-head">
                    <span class="dt-ic"><svg><use href="#i-receipt"/></svg></span>
                    <b class="dt-t">سفارشات رسیده</b>
                    <svg class="dt-chev" aria-hidden="true"><use href="#i-chev"/></svg>
                </span>
                <div class="dt-stat"><b id="desk-ord-num">۰</b><span>سفارش</span></div>
            </button>
            <button class="desk-tile" data-go="s-sell-rfqs" type="button">
                <span class="dt-head">
                    <span class="dt-ic"><svg><use href="#i-inbox"/></svg></span>
                    <b class="dt-t">درخواست‌های قیمت</b>
                    <svg class="dt-chev" aria-hidden="true"><use href="#i-chev"/></svg>
                </span>
                <div class="dt-stat"><b id="desk-rfq-num">۰</b><span>درخواست</span></div>
            </button>
        </div>

        <!-- ═══ کارتابل: نیازمند اقدام ═══
             ۱) ردیف «شروع» (FD-12) — گامِ راه‌اندازی، به‌عنوان ردیفی
                ساده و کمی متفاوت (قاب نقطه‌چین + نشان «شروع»)؛ متن و
                مقصد را deskHomeSync() از scoreItemsSell[].desk می‌گذارد.
             ۲) «در انتظار تایید» (FD-16 — حکم مالک: حتماً این‌جا باشد):
                مشتری جدید رسیده → دفتر مشتریان.
             ۳) ردیف‌های زندهٔ ارتباطی — سفارش/درخواست (اقدام‌های فوری) -->
        <div class="section-title"><h2>نیازمند اقدام</h2></div>
        <div class="rows">
            <div class="row row-start" id="sell-desk-row" hidden>
                <div class="thumb thumb-sm" style="background: var(--arm-soft); color: var(--arm-strong); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-rocket"/></svg>
                </div>
                <div class="row-body">
                    <div class="row-title"><span id="ds-row-t"></span><span class="st-b">شروع</span></div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
            <!-- FD-16: «در انتظار تایید» در کارتابل اقدام — مشتری جدید
                 (customers isNew)؛ متن/علمیت از deskHomeSync() -->
            <div class="row" id="sell-pend-row" data-go="s-customers" hidden>
                <div class="thumb thumb-sm" style="background: var(--amber-soft); color: var(--amber); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-user-plus"/></svg>
                </div>
                <div class="row-body">
                    <div class="row-title"><span id="sell-pend-t">۱ مشتری جدید</span></div>
                    <div class="row-sub">در انتظار تایید تو — کاتالوگت را ذخیره کرده</div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
            <div class="row" data-go="s-sell-orders" id="sell-desk-orders-row">
                <div class="thumb thumb-sm" style="background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-receipt"/></svg>
                </div>
                <div class="row-body">
                    <!-- FD-18: شمارندهٔ زنده از ordersIn (deskOrdersSync) -->
                    <div class="row-title" id="sell-desk-orders-t">۲ سفارش جدید</div>
                    <div class="row-sub" id="sell-desk-orders-s">رستوران مهر <span class="dot">·</span> سوپرمارکت الماس</div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
            <div class="row" data-go="s-sell-rfqs">
                <div class="thumb thumb-sm" style="background: var(--amber-soft); color: var(--amber); display: grid; place-items: center;">
                    <svg style="width: 20px; height: 20px;"><use href="#i-inbox"/></svg>
                </div>
                <div class="row-body">
                    <div class="row-title">۲ درخواست قیمت</div>
                    <div class="row-sub">هنوز پاسخ نداده‌ای</div>
                </div>
                <div class="row-chev"><svg><use href="#i-chev"/></svg></div>
            </div>
        </div>

        <div class="hint-line">
            <svg><use href="#i-sparkles"/></svg>
            <span>۳ خریدار عمدهٔ جدید با محصولات کاتالوگ شما هم‌خوانی دارند.</span>
        </div>
    </div>

    <!-- FD-12 (حکم مالک): نام میزها در تب‌بار — «جا» است نه «فعالیت»؛
         یکدست با ناوبری پنل و تقویت مدل ذهنی دو میزی. -->
    <nav class="tabbar">
        <button class="tab active" data-tab-arm="sell" data-tab-home="s-home-sell">
            <svg><use href="#i-store"/></svg> میز فروش
        </button>
        <button class="tab" data-tab-arm="buy" data-tab-home="s-home-buy">
            <svg><use href="#i-basket"/></svg> میز خرید
        </button>
        <button class="tab" data-tab-home="s-msgs">
            <svg><use href="#i-msg"/></svg> پیام‌ها
        </button>
        <button class="tab" data-tab-home="s-profile">
            <svg><use href="#i-user"/></svg> پروفایل
        </button>
    </nav>
</section>
