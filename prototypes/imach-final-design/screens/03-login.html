<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۰۳: ورود
     FD-13 (هماهنگی با قید FD-12): پنل پیامکی/کد تأیید نداریم —
     ورود = شماره + رمزی که کاربر پس از اولین ورود، با ردیف «شروع»
     در میز خرید برای خودش ساخته است (sheet-pass). نمایِ کد ۵ رقمیِ
     قدیمی حذف شد چون با محدودیت واقعی محصول تناقض داشت.
     FD-26 (بازطراحی — حکم مالک): فراموشی رمز = درجهٔ دوم اهمیت —
     پایین‌تر و بی‌رنگ؛ «حساب ندارم — ثبت‌نام می‌کنم» مهمتر است:
     بالاتر و رنگی. بازیابی هم بدون تماس/واتس‌اپ: فقط شمارهٔ موبایل
     حساب را وارد می‌کند و به خود آی‌مچ می‌فرستد؛ پاسخ: «به زودی رمز
     موقت برای شما ارسال می‌شود» (شیت sheet-forgot).
     ══ -->
<section class="screen" id="s-login" data-arm="keep">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">ورود<small>یک قدم تا دفتر کارت</small></div>
    </div>

    <div class="body">
        <div class="field">
            <label>شماره موبایل</label>
            <input class="input" type="tel" placeholder="۰۹۱۲ ۳۴۵ ۶۷۸۹" inputmode="tel">
        </div>
        <div class="field">
            <label>رمز ورود</label>
            <input class="input" type="password" placeholder="••••••" autocomplete="current-password">
            <div class="hint">رمزی که پس از اولین ورود، در میز خرید برای خودت ساخته‌ای</div>
        </div>

        <!-- FD-26 (حکم مالک): «فراموشی رمز عبور رو ببر پایین و رنگش رو
             هم عادی کن چون در درجهٔ دوم اهمیت هست و حساب ندارم ثبت نام
             می‌کنم خیلی مهمتره و باید بالاتر باشه و رنگی» — ثبت‌نام اول و
             نارنجی؛ فراموشی بعدش و خاموش («خیلی نمی‌خوام فراموشی رمز
             عبور توی چشم باشه»). -->
        <button class="linklike" type="button" data-go="s-signup">حساب ندارم — ثبت‌نام می‌کنم</button>
        <button class="linklike linklike-quiet" type="button" data-sheet="sheet-forgot">رمزم را فراموش کردم</button>
    </div>

    <div class="sticky-bar">
        <button class="btn btn-primary btn-block" data-login>ورود به آی‌مچ</button>
    </div>

    <!-- ═══ FD-26 — شیت: بازیابی رمز (بازطراحی مالک — شماره به خود آی‌مچ)
     حذف تماس/واتس‌اپ پشتیبانی (FD-22): «بازیابی رمز عبور رو از تماس
     یا واتساپ استفاده نکن. بفرسته به خود آیمچ. فقط شماره موبایل رو
     وارد کنه و بفرسته به آیمچ» — فرم: «شماره موبایل حساب خود را
     وارد کنید.» + دکمهٔ «ارسال شماره به پشتیبانی برای بازیابی رمز
     عبور»؛ پس از ارسال: «به زودی رمز موقت برای شما ارسال می‌شود».
     در محصول واقعی: تیکت پشتیبانی + رمز موقت درون‌برنامه‌ای (فاز
     رشد: پیامک — همان feature flag FD-22). forgotReset (app-forms.js)
     بازشدن بعدی را با فرم تمیز برمی‌گرداند. -->
    <div class="sheet" id="sheet-forgot" hidden>
        <div class="grab"></div>
        <div class="sheet-hdr">
            <h3>بازیابی رمز</h3>
            <button class="mg" data-sheet-close="sheet-forgot" aria-label="بستن"><svg><use href="#i-x"/></svg></button>
        </div>

        <!-- نمای فرم -->
        <div id="forgot-view">
            <div class="sub">شماره موبایل حساب خود را وارد کنید.</div>
            <div class="field">
                <label>شماره موبایل</label>
                <input class="input" id="forgot-phone" type="tel" placeholder="۰۹۱۲ ۳۴۵ ۶۷۸۹" inputmode="tel">
            </div>
            <button class="btn btn-primary btn-block" id="forgot-send" type="button" style="margin-top: 10px;">
                <svg><use href="#i-send"/></svg> ارسال شماره به پشتیبانی برای بازیابی رمز عبور
            </button>
            <div class="hint-line" style="margin-top: 10px;">
                <svg><use href="#i-lock"/></svg>
                <span>برای امنیتت، رمز فقط به شماره‌ای داده می‌شود که حساب با آن ساخته شده است.</span>
            </div>
        </div>

        <!-- نمای ارسال شد — متن مالک: «به زودی رمز موقت برای شما ارسال می شود» -->
        <div id="forgot-ok" hidden>
            <div class="ok-pill"><svg><use href="#i-check"/></svg></div>
            <div class="ok-ttl">به زودی رمز موقت برای شما ارسال می‌شود</div>
            <div class="ok-sub">پشتیبانی آی‌مچ رمز موقت را برای همین شماره می‌فرستد.</div>
            <button class="btn btn-primary btn-block" id="forgot-close" type="button" style="margin-top: 10px;">بستن</button>
        </div>
    </div>
    </section>
