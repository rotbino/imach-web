<!-- ═════════════════════════════════════════════════════════════
     اسکرین ۱۴: ویرایش کالا
     تغییر قیمت، موجودی، حداقل سفارش + حذف کالا.
     ═════════════════════════════════════════════════════════════ -->
<section class="screen" id="s-sell-edit" data-arm="sell">
    <div class="subheader">
        <button class="back" data-back aria-label="بازگشت"><svg><use href="#i-back"/></svg></button>
        <div class="ttl">ویرایش کالا<small>برنج هاشمی · کیسه ۵۰ کیلویی</small></div>
    </div>

    <div class="body">
        <div class="picked-card" style="background: linear-gradient(135deg, #F7F6F2, #FFF); border-color: var(--border);">
            <div class="thumb">
                <img src="png/goods/rice-sack.jpg" alt="">
            </div>
            <div class="info">
                <div class="nm">برنج هاشمی</div>
                <div class="sub">فله · کیسه ۵۰ کیلویی · کیفیت درجه یک</div>
            </div>
        </div>

        <div class="field price-field">
            <label>قیمت هر کیسه <span class="opt">— تومان</span></label>
            <input class="input" type="tel" id="edit-price" value="۲٬۸۵۰٬۰۰۰" inputmode="numeric">
            <div class="unit-hint" id="edit-unit-hint">
                <svg><use href="#i-info"/></svg>
                <span id="edit-unit-hint-tx">هر کیلوگرم ≈ ۵۷٬۰۰۰ تومان</span>
            </div>
        </div>

        <div style="display: flex; gap: 9px;">
            <div class="field" style="flex: 1;">
                <label>موجودی</label>
                <input class="input" type="tel" value="۳۵" inputmode="numeric">
            </div>
            <div class="field" style="flex: 1;">
                <label>حداقل سفارش</label>
                <input class="input" type="tel" value="۵" inputmode="numeric">
            </div>
        </div>

        <div class="field">
            <label>عکس کالا</label>
            <button class="img-pick has-img" type="button">
                <div class="img-slot"><img src="png/goods/rice-sack.jpg" alt=""></div>
                <div class="tx">
                    <b>تغییر عکس کالا</b>
                    <small>عکس فعلی ثبت شده است</small>
                </div>
            </button>
        </div>

        <div class="field">
            <label>توضیحات <span class="opt">— اختیاری</span></label>
            <textarea class="input" placeholder="شرایط فروش، پرداخت، تحویل…"></textarea>
        </div>

        <div class="section-title" style="margin-top: 8px;">
            <h2 style="color: var(--red);"><svg style="color: var(--red);"><use href="#i-trash"/></svg> حذف کالا</h2>
        </div>

        <div class="card" style="border-color: #F3C1C1; background: #FDF6F6;">
            <div style="font-size: 12px; color: var(--text-2); line-height: 1.9; margin-bottom: 12px;">
                اگر این کالا را دیگر نمی‌فروشی، حذفش کن. حذف کالا قابل بازگشت است — فقط از کاتالوگ عمومی پنهان می‌شود.
            </div>
            <button class="btn btn-outline btn-block" style="color: var(--red); border-color: #F3C1C1;" data-delete-item>
                <svg><use href="#i-trash"/></svg> حذف این کالا از کاتالوگ
            </button>
        </div>
    </div>

    <div class="sticky-bar">
        <button class="btn btn-primary btn-block" data-edit-save>
            <svg><use href="#i-check"/></svg> ذخیرهٔ تغییرات
        </button>
    </div>
</section>
