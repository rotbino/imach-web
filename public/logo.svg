<?xml version="1.0" encoding="UTF-8"?>
<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 32 33"
        fill="none"
>
    <defs>
        <!-- گرادیان اصلی -->
        <linearGradient id="brandGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FB923C"/>
            <stop offset="100%" stop-color="#EA580C"/>
        </linearGradient>

        <!-- گرادیان نقطه -->
        <radialGradient id="dotGradient" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FDBA74"/>
            <stop offset="60%" stop-color="#F97316"/>
            <stop offset="100%" stop-color="#EA580C"/>
        </radialGradient>

        <!-- هاله‌ی درخشان -->
        <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#F97316" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- هاله‌ی درخشان پشت نقطه -->
    <circle cx="6" cy="6" r="12" fill="url(#dotGlow)"/>

    <!-- نقطه‌ی اصلی — نبض کم‌تر، هرگز به M نمی‌چسبه -->
    <circle cx="6" cy="6" r="5.5" fill="url(#dotGradient)">
        <animate
                attributeName="r"
                values="5.5;5.9;5.5"
                dur="2.4s"
                repeatCount="indefinite"
                calcMode="spline"
                keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
        />
    </circle>

    <!-- بازتاب سفید -->
    <circle cx="4.4" cy="4.2" r="1.5" fill="#FFFFFF" opacity="0.55"/>

    <!-- خط M — پایه‌ی چپ از بالا کوتاه‌تر شد -->
    <path
            d="M5 30
           V19
           L16 23
           L27 11
           V28"
            stroke="url(#brandGradient)"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"
    />
</svg>