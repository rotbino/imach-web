:root {
  --primary: #f97316; --primary-strong: #ea580c; --accent: #fdeedd; --accent-fg: #9a3d06;
  --bg: #fcfbf8; --page: #eeece6; --fg: #2a2723; --card: #fff; --muted: #f4f2ed; --muted-fg: #7d786e;
  --border: #e7e4dc; --border-strong: #d8d4ca; --stone: #292524;
  --green: #16a34a; --green-bg: #e9f7ee; --red: #dc2626; --red-bg: #fdeced; --amber: #b45309; --amber-bg: #fdf3e3;
  --r: 16px; --r-sm: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: 'IRANSans', Tahoma, sans-serif; background: var(--page); color: var(--fg); font-size: 14px; line-height: 1.7; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
img { display: block; max-width: 100%; }
.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 26px; height: 26px; }

/* ── قاب ── */
.stage { min-height: 100%; display: flex; justify-content: center; align-items: center; padding: 24px 0; }
.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 48px)); background: var(--bg); border-radius: 28px; overflow: hidden; box-shadow: 0 24px 64px rgba(42,39,35,.22); display: flex; flex-direction: column; }
@media (max-width: 480px) { .stage { padding: 0; } .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; } }

.hdr { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border); min-height: 60px; }
.hdr .logo { height: 24px; }
.hdr .title { flex: 1; min-width: 0; }
.hdr .title b { display: block; font-size: 16px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .title small { display: block; color: var(--muted-fg); font-size: 11.5px; line-height: 1.4; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:active { background: var(--muted); }

.main { flex: 1; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
.main.flush { padding: 0; }
.main > * + * { margin-top: 14px; }
.footer-bar { flex: none; padding: 12px 16px; background: #fff; border-top: 1px solid var(--border); display: flex; gap: 10px; }

.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border-top: 1px solid var(--border); padding: 6px 8px 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted-fg); font-size: 12px; border-radius: 12px; }
.tab .i { width: 23px; height: 23px; }
.tab.on { color: var(--primary-strong); font-weight: 700; }

/* ── اجزا ── */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
.card.tight { padding: 0; overflow: hidden; }
.muted { color: var(--muted-fg); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.bold { font-weight: 700; }
.green { color: var(--green); } .red { color: var(--red); } .orange { color: var(--primary-strong); }
.h1 { font-size: 22px; font-weight: 700; line-height: 1.5; }
.h2 { font-size: 16px; font-weight: 700; }
.sec-title { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; }
.sec-title a, .link { color: var(--primary-strong); font-weight: 700; font-size: 12.5px; text-decoration: none; cursor: pointer; }
.flex { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 13px; font-weight: 700; font-size: 14px; white-space: nowrap; border: 1px solid transparent; }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:active { background: var(--primary-strong); }
.btn.dark { background: var(--stone); color: #fff; }
.btn.ghost { background: #fff; border-color: var(--border-strong); }
.btn.soft { background: var(--accent); color: var(--accent-fg); }
.btn.green { background: var(--green); color: #fff; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 12.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex-wrap: wrap; }
.chips.nowrap { flex-wrap: nowrap; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: #fff; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.chip.on { background: var(--accent); border-color: var(--primary); color: var(--accent-fg); font-weight: 700; }

.badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge.green { background: var(--green-bg); color: var(--green); }
.badge.red { background: var(--red-bg); color: var(--red); }
.badge.amber { background: var(--amber-bg); color: var(--amber); }
.badge.muted { background: var(--muted); color: var(--muted-fg); }
.badge.orange { background: var(--accent); color: var(--accent-fg); }

.field { display: block; }
.field > span { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
.input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 13px; background: #fff; font-size: 15px; outline: none; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(249,115,22,.15); }
.input.num { direction: ltr; text-align: right; font-weight: 700; letter-spacing: .3px; }
textarea.input { height: auto; min-height: 150px; padding: 12px 14px; line-height: 1.9; resize: vertical; }
.input-suffix { position: relative; }
.input-suffix .input { padding-left: 64px; }
.input-suffix em { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted-fg); font-size: 12.5px; }
.hint { font-size: 12px; color: var(--muted-fg); margin-top: 6px; }

.search { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 14px; background: #fff; border: 1.5px solid var(--border-strong); border-radius: 15px; }
.search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(249,115,22,.15); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 15px; height: 100%; }
.search .i { color: var(--muted-fg); }

.thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--muted); border: 1px solid var(--border); flex: none; }
.thumb.lg { width: 72px; height: 72px; }
.thumb.ph { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted-fg); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex: none; }
.avatar.sm { width: 36px; height: 36px; font-size: 15px; }

.list { background: #fff; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: right; }
.row + .row { border-top: 1px solid var(--border); }
button.row:active, .row.tap:active { background: var(--muted); }
.row .body { flex: 1; min-width: 0; }
.row .name { font-weight: 700; font-size: 14px; line-height: 1.5; }
.row .sub { font-size: 12px; color: var(--muted-fg); line-height: 1.6; }
.row .end { text-align: left; flex: none; }
.price { font-weight: 700; font-size: 15px; white-space: nowrap; }
.price small { font-weight: 400; font-size: 11px; color: var(--muted-fg); margin-right: 2px; }
.trend { font-size: 11px; font-weight: 700; }

.banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.7; }
.banner.amber { background: var(--amber-bg); color: var(--amber); }
.banner.green { background: var(--green-bg); color: #166534; }
.banner.info { background: var(--muted); color: var(--fg); }
.banner.orange { background: var(--accent); color: var(--accent-fg); }
button.banner { width: 100%; text-align: right; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted-fg); }
.empty .i { width: 44px; height: 44px; margin: 0 auto 10px; color: var(--border-strong); }
.empty b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }

.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--border-strong); flex: none; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: right .15s; }
.switch.on { background: var(--green); }
.switch.on::after { right: 21px; }

.seg { display: flex; background: var(--muted); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; height: 38px; border-radius: 9px; font-size: 13px; color: var(--muted-fg); }
.seg button.on { background: #fff; color: var(--fg); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* نتایج جستجوی واحد */
.res-group { font-size: 12px; font-weight: 700; color: var(--muted-fg); margin: 4px 2px 8px; }
.res .tag { font-size: 10.5px; }
mark { background: #fff1c2; color: inherit; border-radius: 3px; padding: 0 1px; }

/* کارت تأمین‌کننده */
.sup { background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
.sup.best { border-color: #9fdcb5; background: linear-gradient(#f3fbf6, #fff 60%); }
.sup .top { display: flex; gap: 10px; align-items: flex-start; }
.sup .norm { font-size: 18px; font-weight: 700; }
.sup .acts { display: flex; gap: 8px; margin-top: 12px; }
.sup .acts .btn { flex: 1; }

/* ویرایش گروهی قیمت */
.bulk-row { display: grid; grid-template-columns: 44px 1fr 128px; gap: 10px; align-items: center; padding: 10px 12px; }
.bulk-row + .bulk-row { border-top: 1px solid var(--border); }
.bulk-row .thumb { width: 44px; height: 44px; border-radius: 10px; }
.bulk-row .input { height: 42px; font-size: 14px; padding: 0 10px; }
.bulk-row.dirty { background: #f3fbf6; }
.bulk-row .stock { font-size: 11px; margin-top: 4px; }

/* چسباندن لیست */
.paste-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px; }
.paste-row + .paste-row { border-top: 1px solid var(--border); }
.paste-row .src { font-size: 11.5px; color: var(--muted-fg); direction: rtl; }
.paste-row .match { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.paste-row .match .thumb { width: 38px; height: 38px; border-radius: 9px; }
.check { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--border-strong); background: #fff; display: flex; align-items: center; justify-content: center; color: #fff; }
.check.on { background: var(--primary); border-color: var(--primary); }
.check .i { width: 15px; height: 15px; stroke-width: 3; }

/* برگهٔ پایین و تُست */
.sheet-wrap { position: absolute; inset: 0; background: rgba(28,25,23,.42); display: flex; align-items: flex-end; z-index: 50; animation: fade .15s; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px 18px; animation: up .2s ease-out; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 0 auto 12px; }
.sheet > * + * { margin-top: 12px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.toast { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--stone); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; z-index: 60; white-space: nowrap; animation: up .2s; display: flex; align-items: center; gap: 6px; }

/* لندینگ و ورود */
.hero { padding: 28px 20px 8px; text-align: center; }
.hero .logo { height: 34px; margin: 0 auto 22px; }
.hero p { color: var(--muted-fg); font-size: 14px; margin-top: 10px; }
.benefit { display: flex; gap: 12px; align-items: flex-start; }
.benefit .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: var(--primary-strong); display: flex; align-items: center; justify-content: center; flex: none; }
.benefit.dark .ic { background: var(--stone); color: #fff; }
.how { counter-reset: s; }
.how li { list-style: none; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.how li + li { margin-top: 10px; }
.how li::before { counter-increment: s; content: counter(s, persian); width: 24px; height: 24px; border-radius: 50%; background: var(--muted); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.otp { display: flex; gap: 10px; justify-content: center; direction: ltr; }
.otp input { width: 56px; height: 60px; text-align: center; font-size: 24px; font-weight: 700; border: 1.5px solid var(--border-strong); border-radius: 14px; outline: none; background: #fff; }
.otp input:focus { border-color: var(--primary); }

  <main class="main" id="main">

        <div class="small muted">کد تأیید پیامک می‌شه. رمز عبور لازم نیست.</div>
        <input class="input num" id="phoneIn" inputmode="numeric" maxlength="11" placeholder="۰۹۱۲۰۰۰۰۰۰۰" value="${esc(fa(L.phone || SEED.businesses[0].phone))}" data-focus>
        <div class="banner info small">${icon('info', 'sm')}<span>برای دیدن حساب نمونه با داده، همین شمارهٔ پیش‌فرض رو نگه دار. با شمارهٔ دیگه، تجربهٔ کاربر تازه‌وارد (کاتالوگ خالی) رو می‌بینی.</span></div>`;

    const me = st.me;
    let body = `<div class="card flex" style="gap:12px"><div class="avatar">${initial(me.name)}</div><div class="grow"><div class="bold">${esc(me.name)}</div>
      <div class="small muted">${esc(me.trade || 'کسب‌وکار')} · ${esc(me.city)}</div>

      body += `<div class="card empty">${icon('store')}<b>کاتالوگت هنوز خالیه</b>اولین کالات رو اضافه کن؛ کمتر از یک دقیقه طول می‌کشه.

    body += `<div class="list">${ls.map((l) => `<button class="row" data-act="edit" data-id="${l.id}">${thumb(lImg(l))}

  /* ── افزودن کالا: جستجوی واحد ← قیمت ── */
  function resultsHtml(q, mode) {
    const owned = new Set(mine().map((l) => l.refId).filter(Boolean));
    const watched = new Set(st.buyList);
    let res = search(q).map((x) => x.e);
    let heading = '';
    if (!q.trim()) { res = ['g1', 'g2', 'r1', 'r3', 'g6'].map((id) => index().find((e) => e.id === id)); heading = 'پرتکرار در صنف شما'; }
    const row = (e) => {
      const key = (e.type === 'ref' ? 'r:' : 'g:') + e.id;
      const n = offersFor(key).length;
      let sub, badge = '';
      if (e.type === 'ref') { sub = `${esc(e.r.brand)} · ${esc(e.r.pack)}`; if (e.r.pending) badge = '<span class="badge amber">در انتظار تأیید</span>'; }
      else sub = mode === 'buy' ? 'هر برند و هر بسته‌بندی' : 'فله / بدون برند · بسته‌بندی دلخواه';
      if (mode === 'add' && e.type === 'ref' && owned.has(e.id)) badge = '<span class="badge green">در کاتالوگ</span>';
      if (mode === 'buy') { if (watched.has(key)) badge = '<span class="badge green">در لیست</span>'; sub += ` · ${fa(n)} فروشنده`; }
      const act = mode === 'buy' ? `data-act="buy-pick" data-key="${key}"` : mode === 'sheet' ? `data-act="sheet-pick" data-type="${e.type}" data-id="${e.id}"` : `data-act="pick" data-type="${e.type}" data-id="${e.id}"`;
      return `<button class="row res" ${act}>${thumb(e.type === 'ref' ? e.r.img || e.g.img : e.g.img)}<div class="body"><div class="name">${esc(e.type === 'ref' ? e.r.name : e.g.name)}</div><div class="sub">${sub}</div></div>${badge}${icon('chev', 'sm')}</button>`;
    };
    if (!res.length) {
      return `<div class="card empty" style="padding:22px">${icon('search')}<b>«${esc(q)}» پیدا نشد</b>${mode === 'add' ? 'می‌تونی همین الان به‌عنوان کالای جدید ثبتش کنی.' : 'املای دیگه‌ای رو امتحان کن.'}</div>`
        + (mode === 'add' ? `<button class="btn ghost block" data-act="new-item">${icon('plus')} ثبت «${esc(q)}» به‌عنوان کالای جدید</button>` : '');
    }
    if (heading) return `<div class="res-group">${heading}</div><div class="list">${res.map(row).join('')}</div>`;
    const refs = res.filter((e) => e.type === 'ref');
    const gs = res.filter((e) => e.type === 'good');
    let html = '';
    const branded = mode === 'buy' ? 'یک برند مشخص' : 'برنددار — عکس و مشخصات آماده';
    const bulk = mode === 'buy' ? 'هر برندی (مقایسهٔ همه)' : 'فله / بدون برند';
    const groups = [[gs, bulk], [refs, branded]];
    if (refs.length && refs[0] === res[0]) groups.reverse();
    groups.forEach(([arr, title]) => { if (arr.length) html += `<div class="res-group">${title}</div><div class="list">${arr.map(row).join('')}</div>`; });
    if (mode === 'add') html += `<button class="btn ghost block" data-act="new-item" style="margin-top:12px">پیدا نکردی؟ ثبت کالای جدید</button>`;
    return html;
  }

  V.add = () => {
    const A = ui.add;

  function marketHint(key, cmp) {

    return `<div class="banner info small">${icon('scale', 'sm')}<span>کمترین قیمت بازار: <b>${money(unitPrice(best))}</b> ${cmp.label} (${fa(o.length)} فروشنده)</span></div>`;
  }
  function priceField(label, val) {
    return `<label class="field"><span>${label}</span><div class="input-suffix"><input class="input num" id="price" inputmode="numeric" data-num data-in="price" value="${val ? money(val) : ''}" placeholder="۰" data-focus><em>تومان</em></div>

  const stockRow = (on) => `<div class="card between"><div><b>موجوده؟</b><div class="tiny muted">اگه تموم شد، فقط خاموشش کن.</div></div><button class="switch ${on ? 'on' : ''}" data-act="add-stock" aria-label="موجودی"></button></div>`;

  function addForm() {

        ${marketHint('r:' + r.id, g.cmp)}

    }
    if (s.type === 'good') {
      const g = G(s.id);
      const pack = curPack();
      return `<div class="card flex" style="gap:12px">${thumb(g.img, 'lg')}<div class="grow"><div class="bold">${esc(g.name)}</div><div class="small muted">فله / بدون برند · ${esc(g.cat)}</div>

  /* ══════════════ رندر ══════════════ */
  const PRIVATE = ['catalog', 'add', 'paste', 'prices', 'buy', 'board', 'buy-add', 'profile'];
  function render() {
    closeSheet();
    const r = route();
    if (!st.authed && PRIVATE.includes(r.name)) return go('/login');
    if (st.authed && (r.name === '' || r.name === 'login')) return go('/catalog');
    if (r.name !== 'prices') ui.prices = null;
    const h = location.hash || '#/';
    const top = ui.stack[ui.stack.length - 1];
    if (top !== h) { if (ui.stack[ui.stack.length - 2] === h) ui.stack.pop(); else ui.stack.push(h); }
    const view = V[r.name] || V.catalog;
    app.innerHTML = view(r.arg);
    const f = app.querySelector('[data-focus]');
    if (f && window.innerWidth > 480) { f.focus(); if (f.setSelectionRange && f.type !== 'number') { const n = f.value.length; try { f.setSelectionRange(n, n); } catch (e) { /* noop */ } } }
    updUnitHint();
  }
  const rerender = () => { const m = document.getElementById('main'); const y = m ? m.scrollTop : 0; render(); const m2 = document.getElementById('main'); if (m2) m2.scrollTop = y; };

  /* ══════════════ رفتارها ══════════════ */
  function addListingFrom(spec) {
    /* spec: {type:'ref'|'good', id, pack?, grade?, price, inStock} — برنددارِ تکراری = به‌روزرسانی */
    if (spec.type === 'ref') {
      const r = R(spec.id); const ex = mine().find((l) => l.refId === r.id);
      if (ex) { if (ex.price !== spec.price) ex.prevPrice = ex.price; ex.price = spec.price; ex.inStock = spec.inStock; ex.updatedAt = Date.now(); return ex; }
      const l = { id: 'l' + Date.now() + Math.random().toString(36).slice(2, 5), bizId: ME, goodId: r.goodId, refId: r.id, pack: r.pack, qty: r.qty, price: spec.price, inStock: spec.inStock, updatedAt: Date.now() };
      st.listings.push(l); return l;
    }
    const ex = mine().find((l) => !l.refId && l.goodId === spec.id && l.qty === spec.pack.qty && (l.grade || null) === (spec.grade || null));
    if (ex) { if (ex.price !== spec.price) ex.prevPrice = ex.price; ex.price = spec.price; ex.inStock = spec.inStock; ex.updatedAt = Date.now(); return ex; }
    const l = { id: 'l' + Date.now() + Math.random().toString(36).slice(2, 5), bizId: ME, goodId: spec.id, grade: spec.grade || undefined, pack: spec.pack.label, qty: spec.pack.qty, price: spec.price, inStock: spec.inStock, updatedAt: Date.now() };
    st.listings.push(l); return l;
  }

    customqty: (el) => { ui.add.customQty = parseDec(el.value); updUnitHint(); },
    newname: (el) => { ui.add.newName = el.value; },
    pastetext: (el) => { ui.paste.text = el.value; },
    pasteprice: (el) => { const r = ui.paste.rows[+el.dataset.i]; r.price = parseNum(el.value); },
    otp: (el) => { el.value = toLatin(el.value).replace(/\D/g, ''); if (el.value && el.nextElementSibling) el.nextElementSibling.focus(); },
    bulkprice: (el) => {
      const id = el.dataset.id; ui.prices[id].price = parseNum(el.value);
      const l = st.listings.find((x) => x.id === id); const d = ui.prices[id];
      document.getElementById('br-' + id).classList.toggle('dirty', d.price !== l.price || d.inStock !== l.inStock);
      document.getElementById('bulkSave').textContent = saveLabel();
    },
  };

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a); return; }
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); closeSheet(); go(g.dataset.go); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.hasAttribute('data-num')) { const n = parseNum(el.value); el.value = n ? money(n) : ''; }
    if (el.hasAttribute('data-dec')) { const m = toLatin(el.value).replace(/[٫/]/g, '.').replace(/[^\d.]/g, '').match(/^\d*\.?\d*/); el.value = fa(m ? m[0] : ''); }
    const f = IN[el.dataset.in]; if (f) f(el);
  });
  document.addEventListener('change', (e) => { if (e.target.dataset.in === 'pasteprice') rerender(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>
